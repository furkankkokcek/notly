<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>Notly</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/card.css">
  <link rel="stylesheet" href="css/components/modal.css">
  <link rel="stylesheet" href="css/components/list.css">
</head>
<body>
  <header id="app-header"></header>
  <main id="main-content"></main>

  <div class="mo" id="note-modal" onclick="if(event.target===this)closeNoteModal()">
    <div class="ms">
      <div id="note-modal-content"></div>
    </div>
  </div>

  <div class="mo" id="settings-modal" onclick="if(event.target===this)closeSettings()">
    <div class="ms">
      <div id="settings-content"></div>
    </div>
  </div>

  <button class="fab" onclick="openNewNote()" title="New Note">+</button>

  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/card.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/list.js"></script>
  <script src="pages/home.js"></script>
  <script src="pages/settings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
